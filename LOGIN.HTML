<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN Page</title>
    <style>
        body {
            background-color: #D2B48C;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .info {
            width: 90%;
            max-width: 400px;
            padding: 30px;
            background-color:#D2B48C;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            color: white;
            border: 4px solid white;
            text-align: center;
        }

        .info h2 {
            font-size: 36px;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }

        label {
            display: block;
            margin-top: 20px;
            font-size: 18px;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background-color: #ff9800;
            color: white;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        #btn, #btn1 {
            display: block;
            width: 100px;
            padding: 12px;
            margin: 15px auto;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #btn:hover, #btn1:hover {
            background-color: #ff9800;
        }

        #error-message {
            display: none;
            background-color: #ff5252;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            text-align: center;
        }

        @media (max-width: 500px) {
            .info {
                padding: 20px;
            }
            .info h2 {
                font-size: 28px;
            }
            input, #btn, #btn1 {
                font-size: 16px;
            }
            label {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="info">
        <h2>Welcome to Login Page</h2>
        <div id="error-message"></div>
        <form id="login-form">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="name@gmail.com" required>
            
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
            
            <button type="submit" id="btn">Login</button>
        </form>
        
        <p style="font-size:14px;">Don't have an account? Register below:</p>
        <button id="btn1" onclick="window.location.href='SIGNUP.html'">Sign Up</button>
    </div>

    <script src="auth.js" type="module"></script>
</body>
</html>
